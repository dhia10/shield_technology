name: Shield Technology CI/CD Pipeline

on:
  # push:
  #   branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab once billing hold is cleared

# Prevent redundant concurrent runs on rapid pushes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Lint, Type Check & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy

      - name: Static Code Analysis & Linting (Ruff)
        run: |
          ruff check .

      - name: Static Type Checking (Mypy)
        run: |
          mypy domain services api infrastructure --ignore-missing-imports

      - name: Execute Pytest Suite with Coverage
        run: |
          pytest tests/ -v --cov=domain --cov=services --cov=api --cov=infrastructure --cov-report=xml --cov-report=term-missing

      - name: Verify Seed Script Integrity
        run: |
          python scripts/seed_demo_data.py
