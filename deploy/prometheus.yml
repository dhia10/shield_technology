global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "shield-telemetry-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
        labels:
          environment: "production"
          service: "shield-api"
          platform: "intelligence-telemetry"
